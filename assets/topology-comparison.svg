<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img">
<rect width="1200" height="760" fill="#F4F7FA"/>
<text x="60.0" y="62.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#0F2742">Standard vs wraparound geometry</text>
<text x="60.0" y="92.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5E6B78">The same point pair can have a different shortest-path distance when opposite edges are identified.</text>
<rect x="60.0" y="125.0" width="500.0" height="545.0" rx="12" fill="#FFFFFF" stroke="#DCE4EA"/>

<rect x="640.0" y="125.0" width="500.0" height="545.0" rx="12" fill="#FFFFFF" stroke="#DCE4EA"/>

<text x="90.0" y="170.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F2742">Standard geometry</text>
<text x="90.0" y="198.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5E6B78">Bounded unit square</text>
<text x="670.0" y="170.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F2742">Wraparound geometry</text>
<text x="670.0" y="198.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5E6B78">Periodic shortest path (2D torus)</text>
<rect x="125" y="245" width="370" height="330" fill="#F8FBFD" stroke="#0F2742" stroke-width="3"/>
<rect x="705" y="245" width="370" height="330" fill="#F8FBFD" stroke="#16A085" stroke-width="3" stroke-dasharray="10 6"/>
<circle cx="170" cy="390" r="10" fill="#2878B5"/>
<circle cx="450" cy="390" r="10" fill="#E76F51"/>
<text x="170.0" y="370.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6B78">A (0.1, 0.1)</text>
<text x="450.0" y="370.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6B78">B (0.9, 0.1)</text>
<circle cx="750" cy="390" r="10" fill="#2878B5"/>
<circle cx="1030" cy="390" r="10" fill="#E76F51"/>
<text x="750.0" y="370.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6B78">A (0.1, 0.1)</text>
<text x="1030.0" y="370.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5E6B78">B (0.9, 0.1)</text>
<line x1="180" y1="390" x2="440" y2="390" stroke="#E76F51" stroke-width="5"/>
<text x="310.0" y="430.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#182230">direct Euclidean distance = 0.8</text>
<line x1="750" y1="390" x2="705" y2="390" stroke="#16A085" stroke-width="5"/>
<line x1="1075" y1="390" x2="1030" y2="390" stroke="#16A085" stroke-width="5"/>
<text x="890.0" y="430.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#182230">boundary-crossing distance = 0.2</text>
<text x="310.0" y="620.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5E6B78">Maximum possible distance: √2 ≈ 1.4142</text>
<text x="890.0" y="620.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5E6B78">Maximum shortest-path distance: √0.5 ≈ 0.7071</text>
<text x="690.0" y="396.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#16A085">↔</text>
<text x="1090.0" y="396.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#16A085">↔</text>
<line x1="60" y1="710" x2="1140" y2="710" stroke="#DCE4EA"/>
<text x="60.0" y="737.0" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#5E6B78">SCHEMATIC — unit-square coordinates; not benchmark data</text>
</svg>
